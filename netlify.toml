[[redirects]]
  from = "/images/:file"
  to = "/.netlify/images?url=/images/:file"
  status = 200

[[redirects]]
  from = "/promo-request"
  to = "/en/promo-request"
  status = 200

[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

[build.environment]
  HUGO_VERSION = "v0.146.2"