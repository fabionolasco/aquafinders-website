{{ define "main" }}
<section class="hero-container" role="region" aria-labelledby="request-title">
    <div class="hero">
    </div>
</section>

<section id="about-us" class="about-us" role="region" aria-labelledby="about-us-title">
    <h2 id="about-us-title">{{ i18n "about_us" }}</h2>
    <div class="about-content">
        <div class="about-text">
            <p>{{ i18n "about_us_p1"   | markdownify}}</p>
            <p>{{ i18n "about_us_p2" }}</p>
            <p>{{ i18n "about_us_p3" }}</p>
            <p>{{ i18n "peace_of_mind" | markdownify }}</p>
            <div class="text-center" role="region" aria-labelledby="contact-title">
                <div style="margin: 40px auto;">
                    <p class="bonded-insured">&#9989; &nbsp; {{ i18n "we_are_insured" }}</p>
                </div>
                <div class="ready text-center">
                    <a href="{{ "/request/" | relLangURL }}" class="cta-button cta-button-now">&nbsp; &nbsp; {{ i18n "start" }} &nbsp; &nbsp; </a>
                </div>
            </div>
        </div>
        <div class="about-image">
            <picture>
                <source type="image/avif" srcset="
                    /images/field-work-mobile.avif   200w,
                    /images/field-work-mobile.avif   400w,
                    /images/field-work-tablet.avif   768w,
                    /images/field-work-medium.avif   1280w
                    /images/field-work-large.avif    1920w
                    " sizes="(max-width: 450px) 398px,
                        (max-width: 768px)  448px,
                        (max-width: 1024px) 371px,
                        (max-width: 1280px) 448px,
                        448px" alt="{{ i18n "about_image_alt" }}">
                <img src="/images/field-work-xlarge.png" alt="{{ i18n "about_image_alt" }}" width="448"
                height="672" loading="lazy">
            </picture>
        </div>
    </div>
</section>
{{ end }}
