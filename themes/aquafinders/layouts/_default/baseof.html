<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode  }}">
<head>
    {{- partial "head.html" . -}}
</head>

<body{{ with .Params.bodyClass }} class="{{ . }}"{{ end }}>
    {{- partial "language-switcher.html" . -}}
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NRJLRXJ2" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    {{- partial "header.html" . -}}

    <main id="top" role="main">
        {{- block "main" . }}{{- end }}
    </main>

    {{- partial "footer.html" . -}}
    {{- partial "scripts.html" . -}}

    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "LocalBusiness",
          "name": "AquaFinders",
          "description": "Unsure where to drill a water well? AquaFinders uses advanced technology to pinpoint optimal, high-yield locations on your site.",
          "image": "https://aquafinders.site/images/logo-h.png",
          "@id": "https://aquafinders.site",
          "url": "https://aquafinders.site",
          "telephone": "+1-732-221-1202",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "957 Yellow Gate Rd",
            "addressLocality": "York",
            "addressRegion": "SC",
            "postalCode": "29745",
            "addressCountry": "US"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 35.015171,
            "longitude": -81.185071
          },
          "openingHoursSpecification": [
            {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": [
                "Monday",
                "Tuesday",
                "Wednesday",
                "Thursday",
                "Friday"
              ],
              "opens": "09:00",
              "closes": "17:00"
            }
          ],
          "sameAs": [
            "https://www.facebook.com/aquafinders"
          ],
          "Schedule":{
              "@type": "Schedule",
              "ScheduleTimezone": "America/New_York"
          }
        }
    </script>
</body>
</html>
