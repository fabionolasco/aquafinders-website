<!DOCTYPE html>
<html lang="{{ .Language.LanguageCode }}">
<head>
    {{- partial "head.html" . -}}
</head>
<body class="lang-{{ .Lang }}{{ with .Params.bodyClass }} {{ . }}{{ end }}">
    <a class="skip-link" href="#main">{{ i18n "skip_to_content" }}</a>
    {{- partial "header.html" . -}}
    <main id="main">
        {{- block "main" . }}{{- end }}
    </main>
    {{- partial "footer.html" . -}}
    {{- if not .Params.hideMobileCta }}{{ partial "mobile-cta.html" . }}{{ end -}}
    {{- partial "scripts.html" . -}}
    {{- partial "jsonld.html" . -}}
</body>
</html>
