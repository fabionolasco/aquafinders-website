{{- /* Vanilla JS only. The page content never depends on it. */ -}}
<script>
(function () {
  'use strict';
  var GA_ID = {{ site.Params.ga4 }};
  window.dataLayer = window.dataLayer || [];
  window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
  gtag('js', new Date());
  gtag('config', GA_ID);

  // Load GA4 on first interaction or when the browser is idle, so it never competes with page rendering.
  var gaLoaded = false;
  function loadGA() {
    if (gaLoaded) return; gaLoaded = true;
    var s = document.createElement('script');
    s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
    document.head.appendChild(s);
  }
  ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (e) {
    window.addEventListener(e, loadGA, { once: true, passive: true });
  });
  window.addEventListener('load', function () {
    if ('requestIdleCallback' in window) { requestIdleCallback(loadGA, { timeout: 4000 }); } else { setTimeout(loadGA, 3000); }
  });

  function track(name, params) { try { gtag('event', name, params || {}); } catch (e) {} }
  window.afTrack = track;

  // Safe storage helpers (storage can be unavailable in private modes).
  function store(kind) { try { return window[kind]; } catch (e) { return null; } }
  function get(kind, k) { var s = store(kind); try { return s ? s.getItem(k) : null; } catch (e) { return null; } }
  function set(kind, k, v) { var s = store(kind); try { if (s) s.setItem(k, v); } catch (e) {} }
  window.afStore = { get: get, set: set };

  // First-touch attribution: kept for the visitor's session so the lead form can report it.
  (function () {
    if (get('localStorage', 'af_first_touch')) return;
    var p = new URLSearchParams(location.search), data = {};
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'gclid'].forEach(function (k) { if (p.get(k)) data[k] = p.get(k); });
    data.landing_page = location.pathname;
    data.referrer = document.referrer || '(direct)';
    data.first_seen = new Date().toISOString();
    set('localStorage', 'af_first_touch', JSON.stringify(data));
  })();

  // Click tracking: [data-track] elements plus all tel: and WhatsApp links.
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a, button');
    if (!a) return;
    var name = a.getAttribute('data-track');
    var href = a.getAttribute('href') || '';
    if (!name && href.indexOf('tel:') === 0) name = 'phone_click';
    if (!name && href.indexOf('wa.me') !== -1) name = 'whatsapp_click';
    if (name) track(name, { label: a.getAttribute('data-track-label') || '', page: location.pathname });
  });

  {{- if .Params.trackView }}
  track({{ .Params.trackView }}, { page: location.pathname });
  {{- end }}

  // Thumbnail gallery lightbox. Without JS the thumbnails are plain links to the full image.
  (function () {
    var gallery = document.querySelector('[data-lightbox]');
    var dlg = document.querySelector('dialog.lightbox');
    if (!gallery || !dlg || typeof dlg.showModal !== 'function') return;
    var links = Array.prototype.slice.call(gallery.querySelectorAll('a'));
    var img = dlg.querySelector('img'), src = dlg.querySelector('source'), count = dlg.querySelector('.lightbox-count');
    var idx = 0, opener = null;
    function show(i) {
      idx = (i + links.length) % links.length;
      var a = links[idx], thumb = a.querySelector('img');
      src.srcset = a.getAttribute('data-full-avif');
      img.src = a.getAttribute('href');
      img.width = +a.getAttribute('data-w'); img.height = +a.getAttribute('data-h');
      img.alt = thumb ? thumb.alt : '';
      count.textContent = (idx + 1) + ' / ' + links.length;
    }
    links.forEach(function (a, i) {
      a.addEventListener('click', function (e) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
        e.preventDefault(); opener = a; show(i); dlg.showModal();
        track('gallery_open', { index: i + 1, page: location.pathname });
      });
    });
    dlg.querySelector('.lightbox-close').addEventListener('click', function () { dlg.close(); });
    dlg.querySelector('.lightbox-prev').addEventListener('click', function () { show(idx - 1); });
    dlg.querySelector('.lightbox-next').addEventListener('click', function () { show(idx + 1); });
    // Clicks on the backdrop (outside the image and buttons) land on the dialog itself.
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
    dlg.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') { e.preventDefault(); show(idx - 1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); show(idx + 1); }
    });
    // Swipe on touch screens.
    var x0 = null;
    dlg.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    dlg.addEventListener('touchend', function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 50) show(idx + (dx < 0 ? 1 : -1));
    }, { passive: true });
    dlg.addEventListener('close', function () { img.removeAttribute('src'); src.removeAttribute('srcset'); if (opener) opener.focus(); });
  })();

  // Mobile menu
  var toggle = document.querySelector('.menu-toggle');
  var menu = document.getElementById('primary-menu');
  if (toggle && menu) {
    toggle.addEventListener('click', function () {
      var open = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!open));
      menu.classList.toggle('is-open', !open);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && menu.classList.contains('is-open')) {
        toggle.setAttribute('aria-expanded', 'false'); menu.classList.remove('is-open'); toggle.focus();
      }
    });
  }
})();
</script>
