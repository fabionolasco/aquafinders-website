{{- if not .IsHome }}
<nav class="breadcrumb" aria-label="{{ i18n "breadcrumb" }}">
    <ol>
        <li><a href="{{ "/" | relLangURL }}">{{ i18n "home" }}</a></li>
        {{- with .Params.parent }}{{ with site.GetPage . }}
        <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{- end }}{{ end }}
        <li><span aria-current="page">{{ .LinkTitle }}</span></li>
    </ol>
</nav>
{{- end }}
