<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<link rel="preload" as="image" href="/images/hero-bg-big-mobile.avif"
    imagesrcset="/images/hero-bg-big-mobile.avif 420w, /images/hero-bg-big-tablet.avif 768w, /images/hero-bg-big-medium.avif 1280w, /images/hero-bg-big-large.avif 1920w, /images/hero-bg-big-xlarge.avif 2000w"
    imagesizes="100vw" fetchpriority="high">
<link rel="icon" type="image/png" href="/favicon/favicon-16x16.png" sizes="16x16" />
<link rel="icon" type="image/png" href="/favicon/favicon-32x32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
<link rel="shortcut icon" href="/favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
<link rel="manifest" href="/favicon/site.webmanifest" />
<title>{{ if .Title }}{{ .Title }} - {{ end }}{{ .Site.Title }}</title>
<link rel="stylesheet" href="/style.css" />
