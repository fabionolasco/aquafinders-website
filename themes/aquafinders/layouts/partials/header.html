{{- $current := . -}}
<header class="site-header">
    <div class="topbar">
        <div class="container topbar-inner">
            <span class="topbar-note">{{ i18n "topbar_note" }}</span>
            <span class="topbar-links">
                <a href="tel:{{ site.Params.contactPhone }}" data-track="phone_click">{{ site.Params.contactPhoneDisplay }}</a>
                {{- partial "language-switcher.html" . -}}
            </span>
        </div>
    </div>
    <nav class="container nav" aria-label="{{ i18n "main_navigation" }}">
        <a class="logo" href="{{ "/" | relLangURL }}">
            <picture>
                <source srcset="/images/logo-horizontal.avif" type="image/avif">
                <img src="/images/logo-horizontal.png" alt="{{ site.Title }} {{ i18n "home" }}" width="280" height="61">
            </picture>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-menu">
            <span class="menu-toggle-icon" aria-hidden="true"></span>
            <span class="visually-hidden">{{ i18n "menu" }}</span>
        </button>
        <div class="menu" id="primary-menu">
            <ul class="menu-links">
                {{- range site.Menus.main }}
                {{- $active := and .Page (eq .Page.RelPermalink $current.RelPermalink) }}
                <li><a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
                {{- end }}
            </ul>
            <a class="btn btn-primary menu-cta" href="{{ "/request/" | relLangURL }}" data-track="primary_cta_click" data-track-label="header">{{ i18n "cta_check_property" }}</a>
        </div>
    </nav>
</header>
