{{ define "main" }}
{{- partial "components/page-header.html" . }}
<div class="section">
    <div class="container narrow">
        <ul class="sitemap-list">
            <li><a href="{{ site.Home.RelPermalink }}">{{ i18n "home" }}</a></li>
            {{- range site.Sections.ByWeight }}{{ if not .Params.noindex }}
            <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ with .Description }} <span class="muted">— {{ . }}</span>{{ end }}</li>
            {{- end }}{{ end }}
        </ul>
    </div>
</div>
{{ end }}
