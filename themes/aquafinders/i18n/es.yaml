phase2_item2: "Interpretación por geólogos independientes asociados"
phase2_item3: "Informe con imagen(es) del subsuelo en corte y ubicación(es) recomendada(s) para perforar"
phase2_item4: "Supuestos y limitaciones explicados en lenguaje claro"
phase2_note: "Estudio estándar para terrenos de hasta 50 acres; los terrenos más grandes se cotizan aparte."
