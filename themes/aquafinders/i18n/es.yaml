# ---------- Limits ----------
limits_title: "Lo que un estudio puede y no puede hacer"
limit_no_drill: "AquaFinders no perfora pozos. Trabajamos junto al perforador que usted elija."
limit_no_guarantee: "Ningún estudio puede garantizar que se encuentre agua, ni prometer un caudal (GPM) o una profundidad."
limit_quality: "Nuestros estudios no analizan la calidad ni la potabilidad del agua. Eso requiere análisis de laboratorio después de perforar."
limit_confirm: "Solo la perforación y una prueba de caudal confirman el resultado. Un estudio le ayuda a decidir con más información."

