based_in: "Con sede en York, Carolina del Sur"
serving_states: "Atendemos Carolina del Norte, Carolina del Sur, Georgia, Tennessee, Kentucky y Virginia."
we_speak: "Hablamos español e inglés"
all_rights_reserved: "Todos los derechos reservados."
results_vary: "Los resultados dependen de la geología de cada terreno."

# ---------- Steps ----------
step1_title: "Cuéntenos sobre su terreno"
step1_text: "Indíquenos dónde está la propiedad y qué busca: un primer pozo, reemplazar un pozo débil o evaluar un terreno antes de comprarlo. Nuestros servicios son más comúnmente utilizados por propietarios de terrenos, agricultores, constructores, inversores y homesteaders."
step2_title: "Estudios geológicos"
step2_text: "Estudios realizados por geólogos profesionales externos.La Fase 1 es un estudio a distancia de la geología, el relieve y las imágenes satelitales. Si indica que vale la pena, la Fase 2 toma medidas de resistividad eléctrica en su propiedad."
step3_title: "Revise los resultados con su perforador"
step3_text: "Recibe un informe con la(s) ubicación(es) recomendada(s) para perforar. Si la recomendación final es no continuar con la perforación del pozo, le presentaremos soluciones alternativas. Los informes están diseñados para ser claros y prácticos."

# ---------- Pricing ----------
