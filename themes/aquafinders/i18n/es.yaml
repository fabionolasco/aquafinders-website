phase1_item2: "Revisión de los registros disponibles de pozos de la zona"
phase1_item3: "Zonas del terreno con mayor y menor potencial de agua subterránea"
phase1_item4: "Una recomendación sobre si conviene hacer el estudio en el sitio, y dónde"
