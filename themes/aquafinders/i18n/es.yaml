# Hero section
hero_title: "¡Encuentra el mejor lugar para perforar tu pozo de agua!"
hero_description: "¡Los pozos secos o de bajo rendimiento son un riesgo real! Además de dañar tu presupuesto, también pueden retrasar la construcción. En AquaFinders, combinamos tecnología avanzada de imágenes subterráneas y análisis geológico experto para evaluar las aguas subterráneas ocultas debajo de tu terreno. Te ayudaremos a seleccionar con confianza las ubicaciones óptimas para la perforación, mejorando significativamente las posibilidades de un pozo productivo que te beneficiará durante décadas."
free_consultation: "Obtén una Consulta Gratuita"

# Services section
our_services: "Nuestros Servicios"
finding_water: "Encontrar agua"
finding_water_description: "Utilizamos técnicas científicas avanzadas para identificar ubicaciones óptimas para la perforación de pozos - residencial, comercial y agricultura."
avoiding_water: "Evitando agua"
avoiding_water_description: "A veces quieres evitar el agua, como al excavar cimientos más profundos, depósitos de gas, vertederos, etc. También podemos ayudarte con eso."
soil_resistivity: "Resistividad del suelo"
soil_resistivity_description: "Prueba requerida para proyectos de conexión a tierra para subestaciones y sistemas de transmisión, granjas solares, plantas industriales, etc."
studies: "Estudios"
studies_description: "Estudios geofísicos e hidrogeofísicos de tu propiedad, para ayudar en trabajos ambientales, de construcción y minería."

# Why us section
who_hire_us: "¿Quién nos contrata?"
