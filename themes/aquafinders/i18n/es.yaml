# Process
info_process: "Haga clic aquí para obtener más información sobre nuestro proceso..."
resistivity: "Resistividad del Suelo"
request_process_title: "Proceso y Precios"
request_steps_title: "Pasos:"
request_step_1: "Usted completa nuestro Formulario de Nuevo Cliente"
start: "Comenzar ahora"
request_step_2: "Nos ponemos en contacto con usted para conocer mejor sus necesidades"
request_step_3: "Usted firma el contrato y realiza el pago ($500)"
request_step_4: "Comenzamos con la caracterización del acuífero y una auditoría regional de pozos, seguido de análisis geoespaciales, topográficos, geológicos e hidrogeofísicos de su propiedad"
request_step_5: "Presentamos su informe y le damos una recomendación clara sobre si debe proceder o no con el siguiente paso: el estudio Geofísico (ERI)."
request_step_6: "Según los datos recopilados, le ayudaremos a decidir si el Estudio Geofísico es la opción adecuada para usted."
request_step_7: "Usted realiza el pago para este segundo estudio ($700)"
request_step_8: "Realizamos el estudio geofísico en su propiedad"
request_step_9: "Le entregamos los resultados finales por correo electrónico, para que pueda enviárselos a su empresa perforadora de pozos o constructor."
request_notes_title: "Notas importantes:"
request_note_1: "Luego usted enviará el informe final a su perforador de pozos para guiar su trabajo."
request_note_2: "Si todo va bien, el proceso puede tomar tan solo tres semanas."
request_note_3: "El tiempo de entrega habitual es de aproximadamente cinco semanas."
request_note_4: "Ofrecemos servicios urgentes para proyectos de emergencia (pueden aplicarsen tarifas adicionales)."
request_note_5: "Tenga en cuenta que el proceso y los pasos pueden variar según sus necesidades, preferencias y condiciones climáticas."
request_note_6: "Ofrecemos descuentos para proyectos más grandes que requieran múltiples estudios."
request_note_7: "Los impuestos de venta no están incluidos en los precios mostrados en este sitio web."
pricing: "Precios"
geo_study: "Estudio Geofísico"
geo_study_description: "Realizamos una evaluación integral que incluye el análisis de múltiples imágenes satelitales, evaluaciones topográficas detalladas, estudios geológicos exhaustivos e investigaciones hidrogeológicas en profundidad. Este enfoque multicapa nos permite identificar las áreas con mayor potencial de agua en su propiedad."
eri_study: "Imágenes de Resistividad Eléctrica"
eri_study_description: "Estudio geofísico de campo utilizando tecnología de Imágenes de Resistividad Eléctrica (ERI), seguido de un análisis completo de datos, interpretación profesional de resultados (múltiples geólogos), generación de informes detallados y una explicación clara de los hallazgos para garantizar una comprensión total y aplicación práctica. Este informe será utilizado por su perforador de pozos/constructor en su toma de decisiones."

