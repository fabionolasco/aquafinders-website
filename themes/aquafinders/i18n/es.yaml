avoiding_water: "Evitar Agua"
avoiding_water_description: "A veces quieres evitar el agua, como al excavar cimientos profundos, depósitos de gas, vertederos, etc. También podemos ayudarte con eso."
soil_resistivity: "Resistividad Subterránea"
