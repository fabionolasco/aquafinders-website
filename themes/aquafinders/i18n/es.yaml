# About us section
about_us: "Sobre Nosotros"
about_us_p1: "AquaFinders es un servicio especializado en la localización de aguas subterráneas que opera principalmente en Carolina del Norte, Carolina del Sur, Georgia, Tennessee y Kentucky, con disponibilidad de servicio en todo el país bajo solicitud. Con nuestro equipo de cinco geólogos/hidrogeólogos, un ingeniero forestal, un ingeniero agrónomo y técnicos locales, utilizamos tecnología de vanguardia para localizar los mejores lugares para perforar pozos de agua productivos."
about_us_p2: "Fundados en el principio de que todos merecen acceso a agua limpia y confiable, nuestros expertos han ayudado a cientos de propietarios, agricultores y empresas a evitar el costoso error de perforar en el lugar equivocado."
about_us_p3: "Nuestro enfoque científico combina análisis geofísico con imágenes hidrogeofísicas—también conocidas como Imágenes de Resistividad Eléctrica (ERI) o Tomografía de Resistividad Eléctrica (ERT)—para maximizar tus posibilidades de encontrar agua y señalar las áreas en tu sitio con la mayor probabilidad de flujo de agua fuerte."
we_are_insured: "¡Estamos asegurados!"
peace_of_mind: "Llamanos hoy para recibir más información. ¡Tranquilidad garantizada!"
about_image_alt: "Equipo de AquaFinders realizando un estudio de aguas subterráneas"

