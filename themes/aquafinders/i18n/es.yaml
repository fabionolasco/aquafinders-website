# ---------- Footer ----------
footer_about: "AquaFinders no realiza estudios geológicos directamente. En su lugar, coordinamos proyectos entre propietarios de terrenos y geólogos calificados, recopilamos datos de campo y facilitamos investigaciones de aguas subterráneas que proporcionan información valiosa para ayudarle a usted y a su perforador de pozos a tomar decisiones informadas sobre dónde perforar."
footer_no_drill: "AquaFinders no perfora pozos. El caudal y la calidad del agua solo se confirman perforando y haciendo pruebas."
footer_services: "Servicios"
footer_contact: "Contacto"
