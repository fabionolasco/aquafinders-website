# Hero section
hero_title: "¡Encuentre el mejor lugar para perforar su pozo de agua!"
hero_description: "¡Los pozos secos o de bajo rendimiento son un gran riesgo! Aparte de arruinar su presupuesto, también pueden retrasar su proyecto de construcción. En AquaFinders, combinamos tecnología avanzada de imágenes subterráneas y análisis geológico experto para evaluar las aguas subterráneas ocultas debajo de su terreno. Le ayudaremos a seleccionar con confianza la ubicación óptima para la perforación, mejorando significativamente las posibilidades de un pozo productivo que le beneficiará por mucho tiempo."
free_consultation: "Consulta Gratuita"
explanation: "✨ Proporcionamos a perforadores de pozos y constructores asesoramiento experto para identificar los mejores lugares donde perforar. ✨"

# Services section
our_services: "Nuestros Servicios"
finding_water: "Encontrar Agua"
