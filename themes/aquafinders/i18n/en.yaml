# About us section
about_us: "About Us"
about_us_p1: "AquaFinders is a specialized groundwater location service operating throughout North and South Carolina. With our team of 5 experienced geologists/hydrogeologists, 1 forest engineer, 1 agriculture engineer, and local technicians, we use cutting-edge technology to locate the best spots for drilling productive water wells."
about_us_p2: "Founded on the principle that everyone deserves access to clean, reliable water, our experts have helped hundreds of homeowners, farmers, and businesses avoid the costly mistake of drilling in the wrong location."
about_us_p3: "Our scientific approach combines geophysical analysis with hydrogeophysical imaging—also known as Electrical Resistivity Imaging (ERI) or Electrical Resistivity Tomography (ERT)—to maximize your chances of finding water and pinpoint the areas on your site with the highest probability of strong water flow."
bonded_insured: "We are bonded and insured!"
peace_of_mind: "Peace of mind!"
