results_vary: "Results depend on site geology."

# ---------- Steps ----------
step1_title: "Tell us about your land"
step1_text: "Share the property location and what you're trying to do: a first well, a replacement for a weak well, or checking land before you buy. Our services are most commonly used by homesteaders, land owners, farmers, builders, and investors."
step2_title: "Geological studies"
step2_text: "Studies conducted by third party professional geologists. Phase 1 is a remote study of the geology, terrain and satellite imagery. If it shows an on-site survey is worthwhile, Phase 2 collects electrical resistivity data on your property."
step3_title: "Review the findings"
step3_text: "You receive a report with recommended drilling location(s). If the final recommendation is to not pursue well drilling, we will present you with alternative solutions. The reports are designed to be clear and actionable."

