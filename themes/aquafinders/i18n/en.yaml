# ---------- Limits ----------
limits_title: "What a study can and can't do"
limit_no_drill: "AquaFinders does not drill wells. We work alongside the driller you choose."
limit_no_guarantee: "No survey can guarantee that water will be found, or promise a flow rate (GPM) or depth."
limit_quality: "Our studies do not test water quality or safety. That requires laboratory sampling after drilling."
limit_confirm: "Drilling and a yield test are the only definitive confirmation. A study helps you make a better-informed decision."

