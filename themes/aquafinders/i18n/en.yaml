# ---------- Footer ----------
footer_about: "AquaFinders does not conduct geological studies directly. Instead, we coordinate projects between landowners and qualified geologists, collect field data, and facilitate groundwater investigations that provide valuable insights to help you and your well driller make informed decisions about where to drill."
footer_no_drill: "AquaFinders does not drill wells. Well yield and water quality can only be confirmed by drilling and testing."
