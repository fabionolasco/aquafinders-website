request_process_title: "Process and Pricing"
request_steps_title: "Steps:"
request_step_1: "You fill out our New Customer Form"
start: "Start now"
request_step_2: "We contact you to learn more about your needs"
request_step_3: "You sign the contract and perform payment"
request_step_4: "We begin with aquifer characterization and a regional well audit, followed by geospatial, topographical, geological, and hydrogeophysical analyses of your property"
request_step_5: "We present your report and provide a clear recommendation on whether or not you should proceed with the next step: the Geophysics (ERI) survey."
request_step_6: "Based on the data collected, we will help decide whether the Geophysical Survey is the right choice for you."
request_step_7: "You perform payment for this second study ($700)"
request_step_8: "We perform the geophysical survey on your property"
request_step_9: "We deliver your final results to you by e-mail, so you can forward it to your well drilling company or builder."
request_notes_title: "Important notes:"
request_note_1: "You will then pass the final report to your well driller to guide their work."
request_note_2: "If everything goes well (pun-intented), the process can take as little as three weeks."
request_note_3: "The usual turnaround is about five weeks."
request_note_4: "We offer rush services for emergency projects (extra fees may apply)."
request_note_5: "Please note that the process and steps may vary depending on your needs, preferences, and weather conditions."
request_note_6: "We offer discounts for larger projects that require multiple studies."
request_note_7: "Sales taxes are not included on prices shown on this website."
pricing: "Pricing"
geo_study: "Geophysical Study"
geo_study_description: "We conduct a comprehensive evaluation that includes the analysis of multiple satellite images, detailed topographic assessments, thorough geological studies, and in-depth hydrogeological investigations. This multi-layered approach enables us to identify the areas with the highest water potential on your property."
eri_study: "Electrical Resistivity Imaging"
eri_study_description: "Geophysical field survey utilizing Electrical Resistivity Imaging (ERI) technology, followed by comprehensive data analysis, professional interpretation of results (multiple geologists), detailed report generation, and a clear explanation of the findings to ensure full understanding and practical application. This report will be used by your well driller/builder in their decision-making."

